experiment:
  name: synthetic_demo
  seed: 42
  notes: Demo on synthetic data (no real data). Run make_synthetic_dataset.py first.
data:
  dataset: synthetic
  label_csv: data\synthetic\labels\synthetic.csv
  image_root: data\synthetic\images
  image_size: 224
  batch_size: 8
  num_workers: 0
aug:
  hflip: false
  rotation_deg: 10.0
  translate: 0.05
  scale_jitter: 0.05
  brightness: 0.1
  contrast: 0.1
model:
  backbone: densenet121_xrv
  pretrained: false
  dropout: 0.2
seg:
  enabled: false
  method: concat_channel
  mask_source: chexmask_u
  mask_root: data/preprocessed/masks/chexmask_u
uq:
  method: none
  mc_passes: 30
  gate_threshold: 0.5
training:
  epochs: 3
  grad_accum_steps: 2
  head_lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 5
  max_grad_norm: 1.0
  bf16: false
  early_stop_patience: 3
  freeze_backbone_epochs: 0
eval:
  metrics:
  - auroc
  - f1
  - ece
  reliability_bins: 15
  threshold: 0.5
xai:
  target_layer: auto
  overlay_alpha: 0.5
paths:
  result_root: result
logging:
  level: info
  val_display_rows: 5

